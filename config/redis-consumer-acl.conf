# Redis ACL configuration for the consumer Redis instance.
#
# The default user has no permissions — all access must go through per-token users.
# When Phase 3 provisions a cache resource, the handler creates an ACL entry like:
#
#   ACL SETUSER usr_<token> on ><password> ~<token>:* +@all
#
# This restricts the user to keys prefixed with their token, preventing any
# cross-tenant data access. The admin user is used by the provisioning handler only.
#
# See: https://redis.io/docs/management/security/acl/

# Default: no permissions (deny anonymous access)
user default off nopass nocommands nokeys

# Admin user for provisioning operations (creating/revoking per-token ACL users)
# Password: instant_admin (change in production via CONSUMER_REDIS_ADMIN_PASSWORD)
user instant_admin on >instant_admin ~* &* +@all
