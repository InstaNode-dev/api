    display_name: "Anonymous"
    price_monthly_cents: 0
    limits:
      provisions_per_day: 5
      postgres_storage_mb: 10
      postgres_connections: 2
      vector_storage_mb: 10
      vector_connections: 2
      redis_memory_mb: 5
      redis_commands_per_day: 1000
