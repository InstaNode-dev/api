# plans-with-extra-tier.yaml — fixture for capabilities_test.go.
#
# Mirrors api/plans.yaml's monthly tier set (anonymous, free, hobby,
# hobby_plus, growth, pro, team) plus one synthetic "test_tier" with rank
# -1. The expectation is that capabilities.go iterates everything in the
# registry, surfaces the 7 known monthly tiers in rank order, and silently
# drops test_tier (rank == -1) without panicking. Yearly variants are
# intentionally omitted — the unit test that exercises annual discount
# math uses a separate fixture (plans-with-annual.yaml).
#
# Limits are reduced/synthetic — these are NOT production values. The
# point is to exercise the iteration + ordering contract, not assert real
# pricing.

plans:
