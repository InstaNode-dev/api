      mongodb_connections: 2
      mongodb_ops_per_minute: 100
      queue_storage_mb: 1024
      storage_storage_mb: 10
      webhook_requests_stored: 100
      team_members: 1
      vault_max_entries: 0
      vault_envs_allowed: []
      deployments_apps: 0
