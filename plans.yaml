      postgres_connections: 20
      vector_storage_mb: 10240
      vector_connections: 20
      redis_memory_mb: 512
      redis_commands_per_day: 500000
      mongodb_storage_mb: 5120
      mongodb_connections: 20
      mongodb_ops_per_minute: 10000
