      queue_count: 20
      storage_storage_mb: 51200
      webhook_requests_stored: 10000
      team_members: 5
      vault_max_entries: 200
      vault_envs_allowed: []
      deployments_apps: 10
      # Pro: 30-day backup retention, 100 manual backups/day, self-serve restore.
